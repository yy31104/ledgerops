[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ledgerops"
version = "0.1.0"
description = "Synthetic transaction integrity and recovery laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerops"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/reference", "/fixtures", "/provider_sim", "/README.md", "/pyproject.toml", "/uv.lock", "/Makefile", "/.python-version"]
exclude = ["/tests/lab_story.py", "/tests/integration/test_lab*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: requires real PostgreSQL in an isolated Docker container"]
