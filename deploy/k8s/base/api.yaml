apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports: [{name: https, port: 8443, targetPort: 8443}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata:
      labels: {app: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9180"
    spec:
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: copy-secrets
          image: ledgerops-local:k8s
          imagePullPolicy: Never
          command: [sh, -c, "cp /secret/* /run/ledgerops/ && chmod 0600 /run/ledgerops/*"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 32Mi}}
          securityContext: &container
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secret, mountPath: /secret, readOnly: true}
            - {name: private, mountPath: /run/ledgerops}
      containers:
        - name: api
          image: ledgerops-local:k8s
          imagePullPolicy: Never
          args: [service]
          env:
            # Physical process flags. The launcher only lets these three override the private profile.
            - {name: LEDGEROPS_RESTORE_MODE, value: "false"}
            - {name: LEDGEROPS_API_WRITES_ENABLED, value: "true"}
          ports: [{containerPort: 8080, name: http-internal}]
          startupProbe:
            httpGet: {path: /health/live, port: 8080, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            # Liveness never touches PostgreSQL: a database outage must not restart-loop the API.
            httpGet: {path: /health/live, port: 8080, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Readiness checks schema, roles and RESTORE/writes flags against the live database.
            httpGet: {path: /health/ready, port: 8080, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext: *container
          volumeMounts:
            - {name: private, mountPath: /run/ledgerops, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: tls-proxy
          image: ledgerops-local-proxy:k8s
          imagePullPolicy: Never
          command: [caddy, run, --config, /etc/ledgerops-caddy/Caddyfile, --adapter, caddyfile]
          env:
            - {name: HOME, value: /tmp}
            - {name: XDG_DATA_HOME, value: /tmp/data}
            - {name: XDG_CONFIG_HOME, value: /tmp}
          ports:
            - {containerPort: 8443, name: https}
            - {containerPort: 9180, name: metrics}
          readinessProbe:
            tcpSocket: {port: 8443}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /metrics, port: 9180}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext: *container
          volumeMounts:
            - {name: caddyfile, mountPath: /etc/ledgerops-caddy, readOnly: true}
            - {name: tls, mountPath: /certs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secret
          secret: {secretName: ledgerops-api, defaultMode: 0440}
        - name: tls
          secret: {secretName: ledgerops-api-tls, defaultMode: 0440}
        - name: caddyfile
          configMap: {name: api-caddy}
        - name: private
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
