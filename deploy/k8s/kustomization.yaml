apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ledgerops
resources:
  - base/namespace.yaml
  - base/postgres.yaml
  - base/bootstrap-job.yaml
  - base/api.yaml
  - base/dispatch.yaml
  - base/probe.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml
configMapGenerator:
  - name: api-caddy
    files: [base/Caddyfile]
  - name: synthetic-probe
    files: [scripts/probe.py]
  - name: prometheus-config
    files: [monitoring/prometheus.yml, monitoring/alerts.yml]
  - name: grafana-dashboards
    files: [monitoring/ledgerops-dashboard.json]
generatorOptions:
  labels: {app.kubernetes.io/part-of: ledgerops}
