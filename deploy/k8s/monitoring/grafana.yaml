apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: http://prometheus:9090, isDefault: true}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: ledgerops, type: file, options: {path: /var/lib/grafana/dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{name: web, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, labels: {app: grafana}}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext:
        runAsUser: 472
        runAsNonRoot: true
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1  # digest pinned in Makefile PINNED
          imagePullPolicy: Never
          env:
            # Admin password comes from a locally generated Secret; anonymous viewers are read-only.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ledgerops-grafana, key: admin-password}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
          ports: [{containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}, periodSeconds: 20, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
        - name: dashboards
          configMap: {name: grafana-dashboards}
