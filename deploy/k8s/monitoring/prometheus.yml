global: {scrape_interval: 10s, evaluation_interval: 10s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ledgerops-pods
    kubernetes_sd_configs: [{role: pod, namespaces: {names: [ledgerops]}}]
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep}
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
