kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledgerops
nodes:
  - role: control-plane
    extraPortMappings:
      # Grafana and Prometheus are reached with kubectl port-forward; nothing is bound publicly.
      - containerPort: 30443
        hostPort: 18443
        listenAddress: 127.0.0.1
