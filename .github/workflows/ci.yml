name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12.15"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check Docker and pull PostgreSQL
        run: |
          docker version
          # Match POSTGRES_IMAGE in tests/conftest.py; pull outside its 60-second startup timeout.
          docker pull postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

      - name: Run checks
        run: make check

      - name: Run the full test suite
        run: make test

      - name: Check assistant scenario snapshots
        env:
          LEDGEROPS_SCENARIOS_CHECK: "1"
        run: |
          uv run --locked ruff check assistant/scenarios
          uv run --locked ruff format --check assistant/scenarios
          uv run --locked python -m pytest -p tests.conftest -q assistant/scenarios/capture.py
