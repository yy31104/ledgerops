name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12.15"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Check Docker and pull PostgreSQL
        run: |
          docker version
          # Match POSTGRES_IMAGE in tests/conftest.py; pull outside its 60-second startup timeout.
          docker pull postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

      - name: Run checks
        run: make check

      - name: Run the full test suite
        run: make test

      - name: Check assistant scenario snapshots
        env:
          LEDGEROPS_SCENARIOS_CHECK: "1"
        run: |
          uv run --locked ruff check assistant/scenarios
          uv run --locked ruff format --check assistant/scenarios
          uv run --locked python -m pytest -c pyproject.toml -p tests.conftest -q assistant/scenarios/capture.py

      - name: Fake agent against the authenticated API
        run: |
          uv run --project assistant --locked --with-editable . --with gunicorn==26.2.0 \
            python -m pytest -c pyproject.toml -p tests.conftest -q \
              assistant/scenarios/agent_acceptance.py assistant/scenarios/handoff_acceptance.py

  assistant:
    name: Operator assistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assistant
    env:
      UV_PYTHON: "3.12.15"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      # The fake provider and the hashing embedder keep this job offline and free:
      # no model download, no API key.
      - name: Test
        run: uv run --locked python -m pytest

      - name: PostgreSQL integration
        run: uv run --locked python -m pytest -m postgres

      # Generation is fake. Retrieval quality uses the pinned, public local encoder.
      - name: Retrieval Recall gate (development split only)
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          uv run --locked python scripts/evaluate_local.py --split dev \
            --baseline eval/results/v3-main-docs-dev.json --output .cache/ci-evaluation.json

      - name: Preserve evaluation and MLflow records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: retrieval-experiment
          path: |
            assistant/.cache/ci-evaluation.json
            assistant/.cache/mlflow
          retention-days: 7

  panel:
    name: React panel and local Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Build and test React
        working-directory: assistant/web
        run: |
          npm ci
          npm run build
          npm test
      - name: Start the local demo with stand-in embeddings
        run: python3 assistant/scripts/compose.py up --hashing
      - name: Check local readiness
        run: curl --fail --silent http://127.0.0.1:8088/health/ready
      - name: Stop the local demo
        if: always()
        run: python3 assistant/scripts/compose.py down
